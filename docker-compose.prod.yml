services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowix-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis:7.2
    container_name: flowix-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]